[project]
name = "healpix-painter"
version = "0.3.0a1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tomas-cabrera", email = "tcabrera@andrew.cmu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "ligo-skymap>=2.2.2",
    "lxml>=6.0.2",
    "pandas>=2.3.0",
    "parmap>=1.7.0",
    "regions>=0.10",
    "typer>=0.16.0",
]

[project.urls]
"Source Code" = "https://github.com/tomas-cabrera/healpix-painter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pre-commit>=4.2.0",
    "pydata-sphinx-theme>=0.21.0",
    "pytest>=8.3.5",
    "ruff>=0.11.6",
    "sphinx>=9.1.0",
    "sphinxcontrib-typer>=0.10.0",
]

[tool.ruff]
exclude = [
    "scratchwork",
]

[project.scripts]
healpix-painter = "healpix_painter.cli:app"

[project.optional-dependencies]
ztf = [
    "ztfquery>=1.28.0",
]
